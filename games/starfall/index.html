<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101322">
  <title>Starfall — a tiny arcade game</title>
  <style>
    :root { color-scheme: dark; font-family: ui-rounded, "Segoe UI", system-ui, sans-serif; background: #101322; color: #f5f3ff; }
    * { box-sizing: border-box; }
    body { min-width: 320px; min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at 50% 0%, #29234b 0, #101322 58%); }
    .game { width: min(900px, 100%); }
    header { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin: 0 4px 14px; }
    .eyebrow { margin: 0 0 5px; color: #b4a7ff; font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(28px, 5vw, 42px); letter-spacing: -.06em; }
    h1 span { color: #b4a7ff; }
    .scoreboard { display: flex; gap: 22px; text-align: right; }
    .scoreboard div { display: grid; gap: 3px; }
    .scoreboard span { color: #9b9bb4; font-size: 10px; letter-spacing: .13em; }
    .scoreboard strong { font-size: 20px; font-variant-numeric: tabular-nums; }
    .frame { position: relative; overflow: hidden; border: 1px solid #48436b; border-radius: 18px; background: #15172a; box-shadow: 0 24px 80px #05050d99; }
    canvas { display: block; width: 100%; height: auto; touch-action: none; }
    .overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 20px; background: #1013229c; backdrop-filter: blur(6px); }
    .overlay[hidden] { display: none; }
    .card { width: min(360px, 100%); padding: 28px; border: 1px solid #ffffff26; border-radius: 16px; background: #191a30ed; text-align: center; box-shadow: 0 18px 60px #0007; }
    .icon { color: #ffdb8a; font-size: 36px; }
    .card h2 { margin: 8px 0; font-size: 30px; letter-spacing: -.05em; }
    .card p { margin: 0 0 20px; color: #c0bfd3; line-height: 1.55; }
    button { border: 0; border-radius: 9px; padding: 12px 22px; color: #171426; background: #c2b5ff; font: inherit; font-weight: 750; cursor: pointer; }
    button:hover { background: #d5cbff; transform: translateY(-1px); }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    .help { display: flex; justify-content: space-between; gap: 14px; padding: 12px 4px 0; color: #aaa9c1; font-size: 12px; }
    kbd { padding: 2px 6px; border: 1px solid #55516d; border-radius: 5px; color: #f1eeff; font: inherit; }
    @media (max-width: 520px) { body { padding: 14px; }.scoreboard { gap: 12px; }.scoreboard strong { font-size: 16px; }.help { font-size: 11px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <main class="game">
    <header>
      <div><p class="eyebrow">A pocket-sized arcade game</p><h1><span>✦</span> Starfall</h1></div>
      <div class="scoreboard" aria-live="polite">
        <div><span>SCORE</span><strong id="score">0</strong></div>
        <div><span>BEST</span><strong id="best">0</strong></div>
        <div><span>SHIELDS</span><strong id="lives">3</strong></div>
      </div>
    </header>
    <section class="frame" aria-label="Starfall game">
      <canvas id="game-canvas" width="800" height="520" role="img" aria-label="Dodge the falling meteors and collect golden stars. Use left and right arrow keys or move your pointer."></canvas>
      <div class="overlay" id="overlay">
        <div class="card">
          <div class="icon" id="overlay-icon" aria-hidden="true">✦</div>
          <h2 id="overlay-title">Catch a little starlight.</h2>
          <p id="overlay-copy">Move left and right to dodge meteors. Golden stars give +100 points and a brief protective shield.</p>
          <button id="play-button" type="button">Start game</button>
        </div>
      </div>
    </section>
    <footer class="help"><span>Move: <kbd>←</kbd> <kbd>→</kbd> or pointer</span><span>Pause: <kbd>P</kbd> · Restart: <kbd>R</kbd></span></footer>
  </main>
  <script>
    (() => {
      const canvas = document.querySelector('#game-canvas');
      const ctx = canvas.getContext('2d');
      const scoreNode = document.querySelector('#score');
      const bestNode = document.querySelector('#best');
      const livesNode = document.querySelector('#lives');
      const overlay = document.querySelector('#overlay');
      const titleNode = document.querySelector('#overlay-title');
      const copyNode = document.querySelector('#overlay-copy');
      const iconNode = document.querySelector('#overlay-icon');
      const button = document.querySelector('#play-button');
      const W = canvas.width;
      const H = canvas.height;
      const keys = new Set();
      const player = { x: W / 2, y: H - 54, r: 15, speed: 390 };
      const stars = Array.from({ length: 75 }, () => ({
        x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.7 + .3, phase: Math.random() * 7
      }));
      let meteors = [];
      let pickups = [];
      let score = 0;
      let lives = 3;
      let best = 0;
      let running = false;
      let animation = 0;
      let last = 0;
      let meteorTimer = 0;
      let pickupTimer = 1.5;
      let elapsed = 0;
      let invulnerable = 0;
      let pointerX = null;
      try { best = Number(localStorage.getItem('starfall-best') || 0) || 0; } catch {}
      bestNode.textContent = best;

      function drawBackground(time) {
        const glow = ctx.createRadialGradient(W * .5, H * .25, 5, W * .5, H * .25, H * .85);
        glow.addColorStop(0, '#29254a');
        glow.addColorStop(1, '#101322');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, W, H);
        for (const star of stars) {
          const alpha = .35 + Math.sin(time * .0015 + star.phase) * .25;
          ctx.fillStyle = 'rgba(231,228,255,' + alpha + ')';
          ctx.beginPath();
          ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function draw(time = 0) {
        drawBackground(time);
        for (const pickup of pickups) {
          ctx.save();
          ctx.translate(pickup.x, pickup.y);
          ctx.rotate(time * .0018);
          ctx.shadowColor = '#ffd678';
          ctx.shadowBlur = 18;
          ctx.fillStyle = '#ffda83';
          ctx.beginPath();
          for (let i = 0; i < 10; i += 1) {
            const radius = i % 2 ? 5 : 11;
            const angle = i * Math.PI / 5 - Math.PI / 2;
            ctx.lineTo(Math.cos(angle) * radius, Math.sin(angle) * radius);
          }
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }
        for (const meteor of meteors) {
          ctx.save();
          ctx.translate(meteor.x, meteor.y);
          ctx.rotate(meteor.rotation);
          ctx.shadowColor = '#ff826d';
          ctx.shadowBlur = 13;
          ctx.fillStyle = '#ff907d';
          ctx.beginPath();
          ctx.arc(0, 0, meteor.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;
          ctx.fillStyle = '#d65c67';
          ctx.beginPath();
          ctx.arc(-meteor.r * .25, -meteor.r * .2, meteor.r * .22, 0, Math.PI * 2);
          ctx.arc(meteor.r * .3, meteor.r * .28, meteor.r * .15, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        if (invulnerable <= 0 || Math.floor(time / 90) % 2 === 0) {
          ctx.save();
          ctx.translate(player.x, player.y);
          ctx.shadowColor = '#bcaeff';
          ctx.shadowBlur = 20;
          ctx.fillStyle = '#d4caff';
          ctx.beginPath();
          ctx.moveTo(0, -player.r - 6);
          ctx.quadraticCurveTo(player.r + 3, 0, 0, player.r);
          ctx.quadraticCurveTo(-player.r - 3, 0, 0, -player.r - 6);
          ctx.fill();
          ctx.fillStyle = '#9282ed';
          ctx.beginPath();
          ctx.moveTo(-5, player.r - 1);
          ctx.lineTo(0, player.r + 12 + Math.random() * 5);
          ctx.lineTo(5, player.r - 1);
          ctx.fill();
          ctx.restore();
        }
      }

      function updateHud() {
        scoreNode.textContent = Math.floor(score);
        livesNode.textContent = lives;
        if (score > best) {
          best = Math.floor(score);
          bestNode.textContent = best;
          try { localStorage.setItem('starfall-best', String(best)); } catch {}
        }
      }

      function showOverlay(icon, title, copy, label) {
        iconNode.textContent = icon;
        titleNode.textContent = title;
        copyNode.textContent = copy;
        button.textContent = label;
        overlay.hidden = false;
      }

      function start() {
        score = 0;
        lives = 3;
        elapsed = 0;
        meteorTimer = 0;
        pickupTimer = 1.5;
        invulnerable = 0;
        meteors = [];
        pickups = [];
        player.x = W / 2;
        pointerX = null;
        updateHud();
        overlay.hidden = true;
        running = true;
        last = performance.now();
        cancelAnimationFrame(animation);
        animation = requestAnimationFrame(frame);
      }

      function endGame() {
        running = false;
        cancelAnimationFrame(animation);
        updateHud();
        showOverlay('✧', 'The sky can wait.', 'Final score: ' + Math.floor(score) + '. Ready for another flight?', 'Play again');
      }

      function pause() {
        running = false;
        cancelAnimationFrame(animation);
        showOverlay('Ⅱ', 'Take a breather.', 'Your flight is paused. Pick up where you left off when you are ready.', 'Resume');
      }

      function frame(now) {
        if (!running) return;
        const dt = Math.min((now - last) / 1000, .04);
        last = now;
        elapsed += dt;
        score += dt * 4;
        invulnerable = Math.max(0, invulnerable - dt);
        if (keys.has('ArrowLeft') || keys.has('a')) player.x -= player.speed * dt;
        if (keys.has('ArrowRight') || keys.has('d')) player.x += player.speed * dt;
        if (pointerX !== null) player.x += (pointerX - player.x) * Math.min(1, dt * 12);
        player.x = Math.max(player.r + 5, Math.min(W - player.r - 5, player.x));

        meteorTimer += dt;
        const spawnInterval = Math.max(.32, .82 - elapsed * .008);
        if (meteorTimer >= spawnInterval) {
          meteorTimer = 0;
          const radius = 11 + Math.random() * 15;
          meteors.push({ x: 18 + Math.random() * (W - 36), y: -radius, r: radius, speed: 145 + Math.random() * 105 + Math.min(130, elapsed * 2), rotation: Math.random() * 7, spin: (Math.random() - .5) * 2.4 });
        }
        pickupTimer += dt;
        if (pickupTimer >= 2.8) {
          pickupTimer = 0;
          pickups.push({ x: 30 + Math.random() * (W - 60), y: -12, speed: 115 + Math.random() * 40 });
        }
        for (const meteor of meteors) {
          meteor.y += meteor.speed * dt;
          meteor.rotation += meteor.spin * dt;
          const dx = meteor.x - player.x;
          const dy = meteor.y - player.y;
          if (!meteor.hit && invulnerable <= 0 && dx * dx + dy * dy < (meteor.r + player.r * .72) ** 2) {
            meteor.hit = true;
            lives -= 1;
            invulnerable = 1.25;
            updateHud();
            if (lives <= 0) { endGame(); return; }
          }
        }
        meteors = meteors.filter((meteor) => meteor.y < H + meteor.r);
        for (const pickup of pickups) {
          pickup.y += pickup.speed * dt;
          const dx = pickup.x - player.x;
          const dy = pickup.y - player.y;
          if (!pickup.hit && dx * dx + dy * dy < 27 ** 2) {
            pickup.hit = true;
            score += 100;
            invulnerable = Math.max(invulnerable, 2);
            updateHud();
          }
        }
        pickups = pickups.filter((pickup) => !pickup.hit && pickup.y < H + 20);
        updateHud();
        draw(now);
        animation = requestAnimationFrame(frame);
      }

      button.addEventListener('click', () => {
        if (titleNode.textContent === 'Take a breather.') {
          running = true;
          last = performance.now();
          overlay.hidden = true;
          animation = requestAnimationFrame(frame);
        } else start();
      });
      canvas.addEventListener('pointermove', (event) => {
        const bounds = canvas.getBoundingClientRect();
        pointerX = (event.clientX - bounds.left) * W / bounds.width;
      });
      canvas.addEventListener('pointerleave', () => { pointerX = null; });
      window.addEventListener('keydown', (event) => {
        const key = event.key.toLowerCase();
        if (['arrowleft', 'arrowright', ' '].includes(event.key.toLowerCase())) event.preventDefault();
        keys.add(key);
        if (key === 'p' && running) pause();
        else if (key === 'p' && !running && titleNode.textContent === 'Take a breather.') {
          running = true;
          last = performance.now();
          overlay.hidden = true;
          animation = requestAnimationFrame(frame);
        }
        if (key === 'r') start();
        if ((key === 'enter' || key === ' ') && !running) button.click();
      });
      window.addEventListener('keyup', (event) => keys.delete(event.key.toLowerCase()));
      window.addEventListener('blur', () => keys.clear());
      draw(0);
    })();
  </script>
</body>
</html>
